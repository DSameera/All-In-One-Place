<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Redirecting…</title>
  <!-- meta fallback -->
  <meta http-equiv="refresh" content="0; URL=NEW2AUS.html"/>
  <script>
    // JS redirect (preserves query/hash and doesn't pollute back history)
    (function(){
      try {
        var target = 'NEW2AUS.html' + (location.search || '') + (location.hash || '');
        window.location.replace(target);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  Redirecting… If you are not redirected automatically, <a href="NEW2AUS.html">click here</a>.
</body>
</html>
